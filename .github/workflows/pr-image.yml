name: PR image

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Builds the image on pull requests without pushing, so a Dockerfile or
    # dependency break fails the PR before it reaches main. Needs no secrets,
    # so it also runs for fork PRs. The job name is the required status check
    # in the main branch ruleset; keep it in sync if renamed.
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
