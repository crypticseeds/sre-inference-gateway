name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  integration:
    name: Integration (Go probe vs live gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - uses: actions/checkout@v4
        with:
          repository: crypticseeds/llm-slo-bench
          path: llm-slo-bench
          persist-credentials: false
      - run: uv run pytest -q -m integration tests/test_streaming_probe.py
        env:
          LLM_SLO_BENCH_DIR: ${{ github.workspace }}/llm-slo-bench
