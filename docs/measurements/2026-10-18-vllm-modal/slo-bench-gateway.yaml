# llm-slo-bench ramp through sre-inference-gateway to vLLM on Modal.
# Identical to the direct run (inference-engineering observability/slo-bench-modal.yaml) except the target.
version: 1

target:
  base_url: http://127.0.0.1:8000/v1 # gateway started with gateway-config.yaml as ./config.yaml
  model: qwen3-8b

request:
  # /no_think: no reasoning parser is enabled, so thinking text would arrive as
  # content and delay the answer. Qwen3 still emits an empty <think></think>
  # first, so semantic TTFT is the first generated token.
  prompt: Explain KV caching in three sentences. /no_think
  max_completion_tokens: 128
  timeout: 60s
  stream_idle_timeout: 10s

load:
  # vLLM runs with --max-num-seqs 16; stay well under it.
  max_in_flight: 8
  stages:
    - duration: 2m
      target_rps: 0.5
    - duration: 2m
      target_rps: 1
    - duration: 2m
      target_rps: 2

slo:
  # Sanity gates only, not real SLOs yet.
  p99_ttft_ms: 2000
  max_error_rate: 0.01

safety:
  max_requests: 500
  max_duration: 7m
  max_cost_usd: 1
  # Must be positive; pricing is zero, so this only caps admitted requests (1000).
  reserve_cost_per_request_usd: 0.001

pricing:
  # Self-hosted: cost is GPU time, not tokens.
  input_usd_per_million_tokens: 0
  output_usd_per_million_tokens: 0

output:
  json: ""
  html: ""
  raw_jsonl: ""
