global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sre-inference-gateway'
    static_configs:
      # Host-run gateway (make dev). For a compose-run gateway use gateway:8000.
      # Recent Colima and Docker Desktop resolve this; Colima fallback: 192.168.5.2:8000.
      - targets: ['host.docker.internal:8000']
    scrape_interval: 5s
    metrics_path: /metrics

